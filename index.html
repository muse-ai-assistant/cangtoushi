'航':{w:["航海梯山采珠还","行到水穷处坐看","颃颃其羽振振鹭"],f:["航天员yyds","杭白菊泡茶","行吧行吧都行"]},
'宁':{w:["宁为玉碎不瓦全","凝碧池头秋色多","狞笑一声撼山岳"],f:["宁静致远先暴富","柠檬精本精","凝视深渊被凝视"]},
'安':{w:["安得广厦千万间","鞍马劳顿为谁忙","谙尽人间悲与欢"],f:["安能辨我是雄雌","安排得明明白白","鹌鹑蛋好吃"]},
'乐':{w:["乐游原上清秋节","落霞孤鹜齐飞处","泺水潺潺绕城流"],f:["乐不思蜀的我","勒紧裤腰带","可乐配炸鸡"]},
'欣2':{w:[],f:[]},
};
delete DB['欣2'];
/* 缺字通用模板：{c} 替换为输入字，保证每字 ≥10 句备选 */
const GEN={
w:["{c}字当头，诗韵自天成","{c}笔生花，妙语满乾坤","{c}下江南，烟雨入诗篇","{c}间明月，照我独酌时","{c}外青山，层峦入画图","{c}上云烟，缥缈若仙境","{c}里乾坤，万象入胸怀","{c}前花开，富贵自然来","{c}后春风，吹绿满园林","{c}畔柳丝，拂水影婆娑","{c}庭信步，闲看云卷舒","{c}阁凭栏，远眺水天长","{c}野苍茫，落日映孤烟","{c}海泛舟，乘风破万浪"],
f:["{c}天干饭，顿顿不能少","{c}下五洋，捉鳖笑哈哈","{c}哥别闹，奶茶先干了","{c}姐威武，熬夜也美丽","{c}兄在上，红包请拿来","{c}妹乖巧，零食管够吃","{c}总霸气，走路带风声","{c}爷威武，广场舞C位","{c}妈喊你，回家吃饭啦","{c}爸说得对，鼓掌就完事","{c}宝贝儿，今天也想你","{c}同学，作业写完了吗","{c}老师好，上课别点我","{c}老板，发工资了吗"]
};
/* —— 核心逻辑（DOM 无关，可 node 测试） —— */
function linesFor(ch,style){
  const pool=[...((DB[ch]&&DB[ch][style])||[])];
  const g=GEN[style];let i=0;
  while(pool.length<10){pool.push(g[i%g.length].replaceAll('{c}',ch));i++;}
  return pool;
}
function makePoem(name,style){
  const chars=[...name],used=new Set();
  return chars.map(ch=>{
    // 优先用该字手写句库；用尽或缺字时再用通用模板补足
    const dict=((DB[ch]&&DB[ch][style])||[]).filter(l=>!used.has(l));
    const pool=dict.length?dict:linesFor(ch,style).filter(l=>!used.has(l));
    const line=pool[Math.floor(Math.random()*pool.length)];
    used.add(line);return line;
  });
}
/* —— 界面逻辑 —— */
let style='w',curPoem=[];
const $=id=>document.getElementById(id);
document.querySelectorAll('.styles button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.styles button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');style=b.dataset.s;
  if(curPoem.length)render(curPoem);
});
$('gen').onclick=()=>{
  const name=$('name').value.trim();
  if(name.length<2||name.length>8){$('hint').textContent='请输入 2-8 个字';return;}
  curPoem=makePoem(name,style);render(curPoem);
};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('gen').click();});
function render(poem){
  $('poem').innerHTML='<div class="poem-body">'+poem.map(l=>`<div class="pl"><span class="hd">${l[0]}</span>${l.slice(1)}</div>`).join('')+'</div>';
  $('acts').style.display='flex';
}
$('copy').onclick=()=>{
  if(!curPoem.length)return;
  navigator.clipboard.writeText(curPoem.join('\n')).then(()=>{
    const b=$('copy');b.textContent='已复制 ✓';setTimeout(()=>b.textContent='📋 复制',1200);
  });
};
/* —— 诗笺卡片：宣纸质感 canvas —— */
$('card').onclick=()=>{
  if(!curPoem.length)return;
  const W=1080,H=1440,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),FF='"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif';
  // 宣纸底
  x.fillStyle='#f5efe0';x.fillRect(0,0,W,H);
  const vg=x.createRadialGradient(W/2,H/2,200,W/2,H/2,900);
  vg.addColorStop(0,'rgba(255,255,255,0.25)');vg.addColorStop(1,'rgba(160,130,80,0.18)');
  x.fillStyle=vg;x.fillRect(0,0,W,H);
  // 纸纹噪点
  for(let i=0;i<1600;i++){
    x.fillStyle=`rgba(120,95,55,${Math.random()*0.05})`;
    x.fillRect(Math.random()*W,Math.random()*H,2,2);
  }
  // 纤维
  x.strokeStyle='rgba(120,95,55,0.06)';x.lineWidth=1;
  for(let i=0;i<40;i++){
    x.beginPath();const sx=Math.random()*W,sy=Math.random()*H;
    x.moveTo(sx,sy);x.lineTo(sx+Math.random()*60-30,sy+Math.random()*60-30);x.stroke();
  }
  // 双线边框
  x.strokeStyle='#8a7a5a';x.lineWidth=4;x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle='rgba(138,122,90,0.5)';x.lineWidth=1;x.strokeRect(58,58,W-116,H-116);
  // 诗：竖排，从右往左
  const n=curPoem.length,fs=76,colW=110;
  const startX=W-170;
  x.textAlign='center';x.textBaseline='middle';
  curPoem.forEach((line,i)=>{
    const cx=startX-i*colW;let cy=300;
    [...line].forEach((ch,j)=>{
      x.fillStyle=j===0?'#b03a2e':'#2b2620';
      x.font=(j===0?'700 ':'')+fs+'px '+FF;
      x.fillText(ch,cx,cy);cy+=fs*1.25;
    });
  });
  // 右侧小字题签
  x.save();x.translate(W-90,H/2);x.rotate(Math.PI/2);
  x.fillStyle='#8a7a5a';x.font='40px '+FF;x.fillText('藏 头 诗',0,0);x.restore();
  // 印章
  x.save();x.translate(150,H-230);x.rotate(-0.06);
  x.fillStyle='#b03a2e';
  x.beginPath();x.roundRect(-75,-75,150,150,18);x.fill();
  x.fillStyle='#f5efe0';x.font='700 62px '+FF;
  x.fillText('藏',0,-34);x.fillText('头',0,34);x.restore();
  // 落款日期
  const d=new Date();
  x.fillStyle='#8a7a5a';x.font='34px '+FF;x.textAlign='right';
  x.fillText(`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`,W-90,H-110);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='藏头诗.png';a.click();
};
